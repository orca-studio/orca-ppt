<!doctype html>
<html lang="zh-CN" data-layout="story">
<head>
  <meta charset="utf-8">
  <title>圆一直都在</title>
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../runtime/tokens.css">
</head>
<body>
<div class="reveal">

<!-- 转场计划（故事线：圆一路传下来，最后变成越来越大的屏幕，版式 story）
1→2  关系：拨号盘和镜头都是圆，同位置同大小         手法：推近式匹配剪辑   锚点：dial → lens
2→3  关系：镜头的圆又成了耳机罩                     手法：推近式匹配剪辑   锚点：lens → earcup
3→4  关系：圆变成了屏幕                             手法：遮挡 + 形态变换   锚点：earcup → screen
4→5  关系：手机的屏幕和电脑的屏幕，同位置同大小     手法：推近式匹配剪辑   锚点：screen → screen
5→6  关系：屏幕越来越大                             手法：遮挡 + 形态变换   锚点：screen → screen
显像管电视的屏幕在照片里太大（推近不到 1.3 倍），只能用遮挡变形进来，所以放在最后。
-->

<div class="slides">

  <section data-guide="dial" data-hold="1.5" data-page="cover">
    <img class="st-photo" src="photos/photo-01.jpg" width="1536" height="1024"
         data-anchors="dial:642,522,122">
    <p class="t-body" style="left:120px; top:820px;">No.01</p>
    <p class="t-h1" style="left:120px; top:880px;">转盘电话</p>
  </section>

  <section data-st="zoom-match" data-st-from="dial" data-st-to="lens" data-guide="lens" data-hold="1.5">
    <img class="st-photo" src="photos/photo-02.jpg" width="1536" height="1024"
         data-anchors="lens:671,502,146">
    <p class="t-body" style="left:120px; top:820px;">No.02</p>
    <p class="t-h1" style="left:120px; top:880px;">胶片相机</p>
  </section>

  <section data-st="zoom-match" data-st-from="lens" data-st-to="earcup" data-guide="earcup" data-hold="1.5">
    <img class="st-photo" src="photos/photo-03.jpg" width="1536" height="1024"
         data-anchors="earcup:887,640,68">
    <p class="t-body" style="left:120px; top:820px;">No.03</p>
    <p class="t-h1" style="left:120px; top:880px;">卡带随身听</p>
  </section>

  <section data-st="iris" data-st-from="earcup" data-st-to="screen" data-guide="screen" data-hold="1.5">
    <img class="st-photo" src="photos/photo-04.jpg" width="1536" height="1024"
         data-anchors="screen:q:310,262,487,227,560,450,380,493">
    <p class="t-body" style="left:120px; top:820px;">No.04</p>
    <p class="t-h1" style="left:120px; top:880px;">翻盖手机</p>
  </section>

  <section data-st="zoom-match" data-st-from="screen" data-st-to="screen" data-guide="screen" data-hold="1.5">
    <img class="st-photo" src="photos/photo-05.jpg" width="1536" height="1024"
         data-anchors="screen:372,218,368,310">
    <p class="t-body" style="left:120px; top:820px;">No.05</p>
    <p class="t-h1" style="left:120px; top:880px;">台式电脑</p>
  </section>

  <section data-st="iris" data-st-from="screen" data-st-to="screen" data-guide="screen" data-hold="2">
    <img class="st-photo" src="photos/photo-06.jpg" width="1536" height="1024"
         data-anchors="screen:335,312,420,340">
    <p class="t-body" style="left:120px; top:820px;">No.06</p>
    <p class="t-h1" style="left:120px; top:880px;">显像管电视</p>
  </section>

</div>
</div>
<script src="../../node_modules/reveal.js/dist/reveal.js"></script>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../runtime/engine.js"></script>
</body>
</html>
