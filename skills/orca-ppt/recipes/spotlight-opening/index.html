<!doctype html>
<html lang="zh-CN" data-layout="standard">
<head>
  <meta charset="utf-8">
  <title>同款 · 手电筒开场</title>
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../runtime/tokens.css">
  <link rel="stylesheet" href="../../runtime/themes/clearing.css">
  <link rel="stylesheet" href="../../runtime/palettes/forest.css">
</head>
<body>
<div class="reveal">

<!-- 转场计划（主题 Clearing，配色 forest，版式 standard）
页内动画（transitions.md「页内动画」）只在开场三页：
  1 落灯   灯头、灯身各走一条 data-path：从画面上方旋转着落下，在中间拼成一盏灯
  2 扫光   整盏灯（.s-group）走一条 data-path 扫一圈，data-light 射出光束，data-lit 的三行大字只在光里看得见
  3 落版   品牌名拖影飞入、擦亮（data-anim），副标题擦除出来
  4 议程   三件事按点击分步一条条上浮（data-step + data-anim），放映时按三下才出完
1→2  关系：同一盏灯，上一页拼好的姿态就是这一页的起点        手法：无（硬切，两页第一帧一样；原片也是「复制上一页 + 按结束状态摆位置」）
2→3  关系：手电筒把品牌页拉出来                            手法：遮挡剪辑 left + 领头元素 lamp，色块用主面色（原片：灯组缓慢移出 + 主题色矩形缓慢进入 · 自右侧，同时放）
3→4  关系：整页绿底收成议程左边的品牌卡                    手法：共享元素  共享：panel
4→5  关系：品牌卡收成窄条，进入第一件事                    手法：共享元素  共享：panel
5→6  关系：窄条撑满整页，结尾                              手法：共享元素  共享：panel
-->

<div class="slides">

  <!-- 1 落灯：灯身先旋转着落下、回弹，灯头随后落到它头上 -->
  <section data-page="cover" data-hold="0.8">
    <div class="s-surface" data-path="0 800 -15 -380; 0.06 809 27 -322; 0.12 837 153 -268; 0.18 883 363 -219; 0.25 960 715 -169; 0.3 960 715 -137; 0.4 960 654 -83; 0.5 960 617 -42; 0.6 960 605 -15; 0.69 960 605 0"
         data-pivot="98 53" style="left:862px; top:552px; width:196px; height:106px; border-radius:20px;"></div>
    <div class="s-surface" data-path="0 960 -200 -360; 0.1 960 14 -360; 0.2 960 28 -241; 0.3 960 72 -146; 0.4 960 144 -74; 0.5 960 245 -27; 0.6 960 375 -3; 0.69 960 534 0"
         data-pivot="46 20" style="left:914px; top:514px; width:92px; height:46px; border-radius:0 0 46px 46px;"></div>
  </section>

  <!-- 2 扫光：光束亮起，扫过藏着的三行大字，最后朝右停在画面边上 -->
  <section data-hold="1">
    <div class="s-group s-light" data-lit="beam" style="left:0px; top:0px; width:1920px; height:1080px;">
      <p class="t-display" style="left:0px; top:160px; width:1920px; text-align:center;">LUMEO</p>
      <p class="t-display" style="left:0px; top:460px; width:1920px; text-align:center;">LUMEO</p>
      <p class="t-display" style="left:0px; top:760px; width:1920px; text-align:center;">LUMEO</p>
    </div>
    <div class="s-group" data-lead="lamp" data-light="beam" data-light-width="92" data-pivot="98 0"
         data-path="0 960 514 0; 0.3 960 514 0; 0.5 948 504 30; 0.7 939 499 55; 0.8 925 476 62; 1.0 839 500 85; 1.1 782 511 92; 1.2 777 506 110; 1.3 862 452 125; 1.5 957 478 170; 1.6 1053 458 182; 1.8 1209 351 220; 1.9 1311 337 232; 2.1 1126 356 225; 2.2 1049 403 210; 2.3 874 454 198; 2.4 758 458 186; 2.6 909 458 176; 2.8 1140 468 150; 3.0 1399 452 125; 3.2 1530 466 105; 3.4 1690 500 95; 3.7 1790 508 90"
         style="left:862px; top:514px; width:196px; height:144px;">
      <div class="s-surface" style="left:52px; top:0px; width:92px; height:46px; border-radius:0 0 46px 46px;"></div>
      <div class="s-surface" style="left:0px; top:38px; width:196px; height:106px; border-radius:20px;"></div>
    </div>
  </section>

  <!-- 3 落版：手电筒往左走出画面，主面色贴着它从右边拉进来；品牌名拖影飞入、擦亮，副标题擦出来 -->
  <section data-st="mask" data-st-direction="left" data-st-mask-color="surface" data-st-mask-lead="lamp" data-auto-animate data-hold="2">
    <div data-id="panel" class="s-surface" style="left:0px; top:0px; width:1920px; height:1080px; border-radius:0px;"></div>
    <p class="t-display t-on-surface" data-anim="trail right .6s @.1; shine .9s @.9" style="left:0px; top:460px; width:1920px; text-align:center;">LUMEO</p>
    <p class="t-label t-on-surface" data-anim="wipe left .6s @.6" style="left:0px; top:720px; width:1920px; text-align:center;">晨屿照明 · 2026 新品发布</p>
  </section>

  <!-- 4 议程：整页绿底收成左边的品牌卡，三件事点一下出一条 -->
  <section data-auto-animate data-hold="2.5">
    <div data-id="panel" class="s-surface" style="left:120px; top:120px; width:640px; height:840px;"></div>
    <p class="t-h1 t-on-surface" style="left:200px; top:200px;">LUMEO</p>
    <p class="t-label t-on-surface" style="left:200px; top:320px;">晨屿照明 · 2026</p>
    <p class="t-label t-dim" style="left:880px; top:200px;">今天的安排</p>
    <p class="t-h1" style="left:880px; top:280px;">三件事</p>
    <p class="t-h2" data-step="1" data-anim="rise" style="left:880px; top:480px;">01　为什么是现在</p>
    <p class="t-h2" data-step="2" data-anim="rise" style="left:880px; top:600px;">02　新品长什么样</p>
    <p class="t-h2" data-step="3" data-anim="rise" style="left:880px; top:720px;">03　什么时候能用上</p>
  </section>

  <!-- 5 第一件事：品牌卡收成窄条 -->
  <section data-auto-animate data-hold="2.5">
    <div data-id="panel" class="s-surface" style="left:120px; top:120px; width:160px; height:840px;"></div>
    <p class="t-label t-dim" style="left:400px; top:200px;">01　为什么是现在</p>
    <p class="t-h1" style="left:400px; top:280px;">光要先照到对的地方</p>
    <p class="t-body" style="left:400px; top:440px; width:1280px;">家里的灯越来越多，真正被用上的却没几盏。这一代产品只做一件事：人走到哪，光就照到哪。</p>
  </section>

  <!-- 6 结尾：窄条撑满整页 -->
  <section data-page="closing" data-auto-animate data-hold="2">
    <div data-id="panel" class="s-surface" style="left:0px; top:0px; width:1920px; height:1080px; border-radius:0px;"></div>
    <p class="t-display t-on-surface" style="left:0px; top:460px; width:1920px; text-align:center;">下一站，见。</p>
    <p class="t-label t-on-surface" style="left:0px; top:720px; width:1920px; text-align:center;">LUMEO · 晨屿照明</p>
  </section>

</div>
</div>
<script src="../../node_modules/reveal.js/dist/reveal.js"></script>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../runtime/engine.js"></script>
</body>
</html>
