<!-- 转场计划（主题 Editorial Forest，配色 mist，版式 standard）
1→2  关系：开场主图收成「改造前」那扇窗，改造后从右边转进来        手法：共享元素   共享：s1
2→3  关系：两扇窗放平，裁成三角形，三座城市的店拼成一块            手法：共享元素   共享：s1, s2
3→4  关系：三角形变成平行四边形错开，获奖的人从框里探出来          手法：共享元素   共享：s1–s3
4→5  关系：平行四边形变成梯形，首尾相接折成流程的五张卡片                手法：共享元素（整组重排） 共享：s1–s4
5→6  关系：卡片放平，排成一道弧，换成六款新品                      手法：共享元素（整组重排） 共享：s1–s5
6→7  关系：弧放平成九宫格，换成九张花絮                            手法：共享元素（整组重排） 共享：s1–s6
7→8  关系：九宫格归位进照片墙，其余补满                            手法：共享元素（整组重排） 共享：s1–s9
照片框整份稿子同一个 data-id（s1–s9），每页都写四个顶点的 clip-path（不要形状就写满长方形）：框的位置、形状跟着变，框里的照片按这一页的场景换。
每页用几张图由场景定：开场一张主图、前后对比两张、三个并列对象三张、人物四张、流程五步、一个系列六款、花絮九张、年度回顾几十张。
