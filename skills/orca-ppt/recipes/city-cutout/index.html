<!doctype html>
<html lang="zh-CN" data-layout="standard">
<head>
  <meta charset="utf-8">
  <title>同款 · 城市漫游</title>
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../runtime/tokens.css">
  <link rel="stylesheet" href="../../runtime/themes/clearing.css">
  <link rel="stylesheet" href="../../runtime/palettes/ledger.css">
</head>
<body>
<div class="reveal">
<!-- 转场计划（主题 Clearing，配色 ledger，版式 standard）
封面是一块色块盖住照片上半截，SHANGHAI 从色块里挖空，天空从字里透出来；色块往下淡出，接进江面。
整份稿子两个共享元素：照片 city（镜头）和色块 veil（字窗）。色块只缩放不变形 —— 宽高比始终 1920:720，
字跟着一起缩，字孔里永远是它正后方的那块照片。
1→2  关系：封面收成角标，镜头推向陆家嘴                    手法：共享元素（形态变换）  共享：city veil
2→3  关系：镜头横移到江这边的老楼，角标不动                  手法：共享元素                共享：city veil card
3→4  关系：镜头沿江摇到右边的弯                              手法：共享元素                共享：city veil card
4→5  关系：镜头推近到塔上那颗球                              手法：共享元素                共享：city veil card
5→6  关系：镜头拉回全景，角标放回封面的大小                  手法：共享元素（形态变换）    共享：city veil
示例内容：城市漫步的文案是示意，照片是 AI 生成的。
-->

<div class="slides">

  <!-- 1 封面：色块盖住天空，字孔里是晚霞 -->
  <section data-page="cover" data-auto-animate data-hold="2.5">
    <img data-id="city" src="art/city.jpg" alt="" style="left:-20px; top:-20px; width:1960px; height:1120px;">
    <div data-id="veil" class="s-knockout" style="left:0px; top:0px; width:1920px; height:720px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-1"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-1)"/>
      </svg>
    </div>
    <p class="t-label t-on-surface" style="left:360px; top:120px; width:1200px; text-align:center;">City Walk · 2026</p>
    <p class="t-h2 t-on-surface" style="left:360px; top:500px; width:1200px; text-align:center;">一江，两岸，走一天</p>
  </section>

  <!-- 2 陆家嘴：封面收成左上角的角标，镜头推向江对面的塔群 -->
  <section data-auto-animate data-auto-animate-duration="1.4" data-hold="3">
    <img data-id="city" src="art/city.jpg" alt="" style="left:-1040px; top:-200px; width:3136px; height:1792px;">
    <div data-id="veil" class="s-knockout" style="left:120px; top:80px; width:720px; height:270px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-2"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-2)"/>
      </svg>
    </div>
    <div data-id="card" class="s-glass" data-auto-animate-delay="1.0" style="left:1200px; top:440px; width:600px; height:480px;"></div>
    <p class="t-label t-on-glass" data-auto-animate-delay="1.1" style="left:1260px; top:500px;">第一站 · 陆家嘴</p>
    <p class="t-h2 t-on-glass" data-auto-animate-delay="1.18" style="left:1260px; top:560px; width:480px;">江对面的天际线</p>
    <p class="t-body t-on-glass" data-auto-animate-delay="1.26" style="left:1260px; top:660px; width:480px;">几座最高的楼挤在江的一个弯里，傍晚从对岸看过去最完整。</p>
  </section>

  <!-- 3 外滩：镜头横移到江这边的老楼（天空留在角标后面），角标和卡片不动，卡片里的字换掉 -->
  <section data-auto-animate data-auto-animate-duration="1.2" data-hold="3">
    <img data-id="city" src="art/city.jpg" alt="" style="left:0px; top:-400px; width:3136px; height:1792px;">
    <div data-id="veil" class="s-knockout" style="left:120px; top:80px; width:720px; height:270px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-3"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-3)"/>
      </svg>
    </div>
    <div data-id="card" class="s-glass" style="left:1200px; top:440px; width:600px; height:480px;"></div>
    <p class="t-label t-on-glass" data-auto-animate-delay="0.8" style="left:1260px; top:500px;">第二站 · 外滩</p>
    <p class="t-h2 t-on-glass" data-auto-animate-delay="0.88" style="left:1260px; top:560px; width:480px;">江这边的老楼</p>
    <p class="t-body t-on-glass" data-auto-animate-delay="0.96" style="left:1260px; top:660px; width:480px;">一排石头房子沿江站着，适合慢慢走，不适合赶时间。</p>
  </section>

  <!-- 4 黄浦江：镜头沿江摇到右边，夕阳落在江面上 -->
  <section data-auto-animate data-auto-animate-duration="1.4" data-hold="3">
    <img data-id="city" src="art/city.jpg" alt="" style="left:-1216px; top:-360px; width:3136px; height:1792px;">
    <div data-id="veil" class="s-knockout" style="left:120px; top:80px; width:720px; height:270px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-4"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-4)"/>
      </svg>
    </div>
    <div data-id="card" class="s-glass" style="left:1200px; top:440px; width:600px; height:480px;"></div>
    <p class="t-label t-on-glass" data-auto-animate-delay="0.9" style="left:1260px; top:500px;">第三站 · 黄浦江</p>
    <p class="t-h2 t-on-glass" data-auto-animate-delay="0.98" style="left:1260px; top:560px; width:480px;">跟着江走</p>
    <p class="t-body t-on-glass" data-auto-animate-delay="1.06" style="left:1260px; top:660px; width:480px;">江在这里拐了个大弯，两岸能互相看见。坐轮渡过江只要几分钟。</p>
  </section>

  <!-- 5 塔上的球：镜头推近，角标和卡片还在原处 -->
  <section data-auto-animate data-auto-animate-duration="1.4" data-hold="3">
    <img data-id="city" src="art/city.jpg" alt="" style="left:-1240px; top:-480px; width:4300px; height:2458px;">
    <div data-id="veil" class="s-knockout" style="left:120px; top:80px; width:720px; height:270px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-5"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-5)"/>
      </svg>
    </div>
    <div data-id="card" class="s-glass" style="left:1200px; top:440px; width:600px; height:480px;"></div>
    <p class="t-label t-on-glass" data-auto-animate-delay="0.9" style="left:1260px; top:500px;">第四站 · 塔下</p>
    <p class="t-h2 t-on-glass" data-auto-animate-delay="0.98" style="left:1260px; top:560px; width:480px;">挂在塔上的球</p>
    <p class="t-body t-on-glass" data-auto-animate-delay="1.06" style="left:1260px; top:660px; width:480px;">从哪条街抬头都能看见它，走丢了就朝它走。</p>
  </section>

  <!-- 6 结尾：镜头拉回全景，角标放回封面的大小 -->
  <section data-page="closing" data-auto-animate data-auto-animate-duration="1.4" data-hold="2.5">
    <img data-id="city" src="art/city.jpg" alt="" style="left:-20px; top:-20px; width:1960px; height:1120px;">
    <div data-id="veil" class="s-knockout" style="left:0px; top:0px; width:1920px; height:720px;">
      <svg viewBox="0 0 1920 720">
        <mask id="ko-6"><rect width="1920" height="720"/><text class="t-knockout" x="960" y="460">SHANGHAI</text></mask>
        <rect width="1920" height="720" mask="url(#ko-6)"/>
      </svg>
    </div>
    <p class="t-label t-on-surface" data-auto-animate-delay="1.1" style="left:360px; top:120px; width:1200px; text-align:center;">City Walk · 2026</p>
    <p class="t-h2 t-on-surface" data-auto-animate-delay="1.2" style="left:360px; top:500px; width:1200px; text-align:center;">下次，换一条路走</p>
  </section>

</div>
</div>
<script src="../../node_modules/reveal.js/dist/reveal.js"></script>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../runtime/engine.js"></script>
</body>
</html>
