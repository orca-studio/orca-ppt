# 官网在私有仓 orca-studio/orca-cloud 的 apps/ppt/(2026-11-09 从本仓迁出,2026-11-11 并入 orca-cloud)。它从本仓的 skill 读同款、样稿和 runtime,
# 还把 references/install.md 发布成 connect-desktop.txt。所以 main 上这些一变,就通知它重新构建、部署。
name: Notify website

on:
  push:
    branches: [main]
    paths:
      - skills/orca-ppt/examples/**
      - skills/orca-ppt/recipes/**
      - skills/orca-ppt/runtime/**
      # 官网把它原样发布成 connect-desktop.txt
      - skills/orca-ppt/references/install.md
      - .github/workflows/notify-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'orca-studio/orca-ppt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ORCA_PPT_CLOUD_DISPATCH:能对 orca-cloud 发 repository_dispatch 的令牌
      # (fine-grained PAT「orca-ppt → cloud dispatch」,只给 orca-studio/orca-cloud 这一个仓的 Contents: Read and write;
      #  secret 名字沿用迁移前的,令牌本身 2026-11-11 改成了指向 orca-cloud)
      - name: Dispatch skill-updated
        env:
          GH_TOKEN: ${{ secrets.ORCA_PPT_CLOUD_DISPATCH }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::没设 ORCA_PPT_CLOUD_DISPATCH,官网不会自动重新部署;到 orca-cloud 手动跑 Deploy ppt"
            exit 0
          fi
          gh api repos/orca-studio/orca-cloud/dispatches \
            -f event_type=skill-updated -f "client_payload[ref]=${{ github.sha }}"
