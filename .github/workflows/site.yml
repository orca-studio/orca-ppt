# 官网 ppt.orca-studio.ai:main 上的官网或同款样稿一变就重新构建、部署到 Cloudflare。
# 同款列表、封面和样稿都从 skills/orca-ppt/ 读,不录样片(点卡片弹窗放映样稿本身)。
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - skills/orca-ppt/examples/**
      - skills/orca-ppt/recipes/**
      - skills/orca-ppt/runtime/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'orca-studio/orca-ppt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # ffmpeg 把样稿里的大 PNG 照片转成 JPEG
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
        working-directory: skills/orca-ppt
      - run: node site/build.mjs
      - name: Deploy
        run: npx --yes wrangler@4.149.0 deploy --config site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
